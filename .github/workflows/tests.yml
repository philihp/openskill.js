name: tests

on:
  push:
    branches:
      - main
  pull_request:

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.x # until 2026-04-30
          - 22.x # until 2027-04-30
          - 24.x # until 2028-04-30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      # The suite runs against src/ via tsx, so dist is never involved. Skip the
      # build (and the `prepare` script that triggers it) so this matrix stays a
      # pure runtime check of the oldest supported Node -- tsdown itself needs
      # Node >=22.18, while the library it emits still targets Node 20. The
      # build is covered by the lint and coverage jobs.
      - run: npm install --ignore-scripts
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install
      - run: npm run build --if-present
      - run: npm run test:coverage
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
